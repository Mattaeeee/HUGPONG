<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HUGPONG Workspace Redirect</title>
  <script>
    const role = localStorage.getItem('hugpong_role');
    if (role === 'superadmin') {
      window.location.replace('roles/super-admin/dashboard.html');
    } else if (role === 'manager') {
      window.location.replace('roles/farm-manager/dashboard.html');
    } else if (role === 'admin') {
      window.location.replace('roles/sra-admin/dashboard.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #F2F4EF; color: #5A6B4A;">
  <p>Loading your HUGPONG workspace...</p>
</body>
</html>
