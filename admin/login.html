<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – HUGPONG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-bg: #F2F4EF;
      --color-primary: #2D5016;
      --color-primary-light: #4A7C2F;
      --color-primary-bg: #E8F0E0;
      --color-accent: #F5A623;
      --color-border: #E2E8DC;
      --color-hug-text: #1A2212;
      --color-hug-text2: #5A6B4A;
      --color-hug-muted: #8A9B7A;
      --font-sans: 'Inter', system-ui, sans-serif;
    }
    html.dark {
      --color-bg: #0C1015;
      --color-primary: #10B981;
      --color-primary-light: #34D399;
      --color-primary-bg: rgba(16, 185, 129, 0.12);
      --color-accent: #F59E0B;
      --color-border: #232E3C;
      --color-hug-text: #F8FAFC;
      --color-hug-text2: #94A3B8;
      --color-hug-muted: #64748B;
    }
    body { font-family: var(--font-sans); }
    html.dark body { background-color: #0C1015 !important; color: #F8FAFC !important; }
    html.dark .bg-white { background-color: #151C24 !important; border-color: #232E3C !important; color: #F8FAFC !important; }
    html.dark .bg-bg { background-color: #0F151C !important; }
    html.dark input { background-color: #0F151C !important; border-color: #232E3C !important; color: #F8FAFC !important; }
    html.dark input:focus { border-color: #10B981 !important; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2) !important; }
    html.dark .text-primary { color: #34D399 !important; }
    html.dark .text-hug-text { color: #F8FAFC !important; }
    html.dark .text-hug-text2 { color: #94A3B8 !important; }
    html.dark .text-hug-muted { color: #64748B !important; }
  </style>
  <script>
    if (localStorage.getItem('hugpong_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="min-h-screen bg-bg flex items-center justify-center relative">

  <!-- Back to Home -->
  <a href="index.html" class="absolute top-5 left-5 flex items-center gap-1.5 text-sm text-hug-text2 font-medium hover:text-primary transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
    </svg>
    Back to Home
  </a>

  <!-- Login Card -->
  <div class="max-w-sm w-full bg-white rounded-2xl shadow-xl border border-border p-10 mx-4">

    <!-- Logo + Heading -->
    <div class="flex flex-col items-center gap-3 mb-7">
      <div class="w-20 h-20 rounded-2xl bg-white border border-border/80 p-2 flex items-center justify-center shadow-xs" style="background-color: #FFFFFF !important;">
        <img src="logo.png" alt="HUGPONG Logo" class="w-full h-full object-contain" />
      </div>
      <div class="text-center">
        <h1 class="text-2xl font-black text-primary leading-tight">HUGPONG</h1>
        <p class="text-sm text-hug-muted mt-1 leading-snug">Sugarcane Block Farm Management Console</p>
      </div>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLoginSubmit(event)" class="flex flex-col gap-4" novalidate>

      <!-- Contact Number -->
      <div class="flex flex-col gap-1.5">
        <label for="contact-input" class="text-xs font-semibold text-hug-text2 uppercase tracking-wide">Contact Number</label>
        <input
          type="tel"
          id="contact-input"
          pattern="^09\d{9}$"
          placeholder="09XX XXX XXXX"
          required
          class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-sm text-hug-text placeholder-hug-muted outline-none focus:border-primary focus:ring-2 focus:ring-primary-bg transition-all"
        />
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1.5">
        <label for="password-input" class="text-xs font-semibold text-hug-text2 uppercase tracking-wide">Password</label>
        <input
          type="password"
          id="password-input"
          placeholder="••••••••"
          required
          class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-sm text-hug-text placeholder-hug-muted outline-none focus:border-primary focus:ring-2 focus:ring-primary-bg transition-all"
        />
      </div>

      <!-- Submit Button -->
      <button
        id="submit-btn"
        type="submit"
        class="mt-1 w-full bg-primary hover:bg-primary-light text-white font-bold text-sm rounded-xl py-3.5 transition-colors flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <span id="btn-spinner" class="btn-spinner"></span>
        <span id="btn-text">Sign In</span>
      </button>

      <!-- Forgot Password & Provisioning Note -->
      <div class="text-center mt-1">
        <p class="text-xs text-hug-muted">Forgot password or need an account? <span class="text-primary font-semibold">Contact your SRA District Administrator.</span></p>
      </div>

    </form>

  </div>
  <!-- /Login Card -->

  <!-- Loading Overlay -->
  <div
    id="loading-overlay"
    class="fixed inset-0 bg-bg/85 backdrop-blur-sm flex items-center justify-center z-50 opacity-0 pointer-events-none transition-all duration-400"
  >
    <div class="flex flex-col items-center gap-5 text-center px-6">
      <div class="w-14 h-14 border-4 border-primary-bg border-t-primary rounded-full overlay-spinner"></div>
      <div>
        <p class="text-base font-bold text-hug-text">Signing you in…</p>
        <p id="overlay-status" class="text-sm text-hug-muted mt-1 transition-all">Verifying credentials…</p>
      </div>
    </div>
  </div>

  <script>
    function handleLoginSubmit(e) {
      e.preventDefault();
      const contactNum = document.getElementById('contact-input').value;
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');
      const submitBtn = document.getElementById('submit-btn');
      const overlay = document.getElementById('loading-overlay');
      const statusText = document.getElementById('overlay-status');
      try {
        const db = JSON.parse(localStorage.getItem('hugpong_db') || '{}');
        const cleanContact = contactNum.replace(/\D/g, '');
        const found = (db.users || []).find(u => u.contact && u.contact.replace(/\D/g, '') === cleanContact);
        if (found) {
          if (found.role === 'Super Admin') localStorage.setItem('hugpong_role', 'superadmin');
          else if (found.role === 'Farm Manager') localStorage.setItem('hugpong_role', 'manager');
          else localStorage.setItem('hugpong_role', 'admin');
        } else if (!localStorage.getItem('hugpong_role')) {
          if (contactNum === '09189876543') {
            localStorage.setItem('hugpong_role', 'manager');
          } else if (contactNum === '09187654321') {
            localStorage.setItem('hugpong_role', 'superadmin');
          } else {
            localStorage.setItem('hugpong_role', 'admin');
          }
        }
      } catch (err) {
        if (!localStorage.getItem('hugpong_role')) localStorage.setItem('hugpong_role', 'admin');
      }
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Authenticating...';
      submitBtn.disabled = true;
      setTimeout(() => {
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100', 'pointer-events-auto');
        setTimeout(() => { statusText.textContent = 'Decrypting access tokens...'; }, 400);
        setTimeout(() => { statusText.textContent = 'Synchronizing SRA weekly prices...'; }, 800);
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1300);
      }, 300);
    }
  </script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
    import { getFirestore } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    const webFirebaseConfig = {
      apiKey: "AIzaSyDYkv9afZa2ZlhxLzIEZfk2b5wP_s2XXpI",
      authDomain: "hugpong-ff.firebaseapp.com",
      projectId: "hugpong-ff",
      storageBucket: "hugpong-ff.firebasestorage.app",
      messagingSenderId: "516809927909",
      appId: "1:516809927909:web:195ec4886bde93e811f80c"
    };

    try {
      const app = initializeApp(webFirebaseConfig);
      const db = getFirestore(app);
      window.firebaseApp = app;
      window.firebaseDB = db;
    } catch (e) {
      console.warn('[HUGPONG] Firebase login init notice:', e);
    }
  </script>
</body>
</html>
